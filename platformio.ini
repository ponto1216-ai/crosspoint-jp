[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = v0.7.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 1920px wide RGBA images
# Default is (320*4+1)*2=2562, we need more for larger images
# Keep the decoder object below the ESP32-C3's fragmented-heap allocation limit.
  -DPNG_MAX_BUFFERED_PIXELS=15424
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort
  -fno-exceptions
# Size optimization flags (CJK: needed to prevent boot loop with large CJK fonts)
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags =
  -std=gnu++11
  -fexceptions


; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/check_cjk_ui_font.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; One ESP32-C3 binary supports both Xteink hardware generations. HalGPIO
  ; selects X3 before EInkDisplay::begin(); X4 remains the default profile.
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  ; CROSSPOINT_VERSION and CROSSPOINT_BUILD_ID are set by scripts/git_branch.py.
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Keep INFO/ERR serial diagnostics while omitting Debug strings from the normal build
custom_i18n_languages = ENGLISH, JAPANESE

[env:debug]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  ; CROSSPOINT_BUILD_ID is set by scripts/git_branch.py.
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Opt-in Debug logging for serial diagnosis
  ; Cache layout diagnostics are compiled into this opt-in build only.  The
  ; default page window covers the reported reader page; adjust these two
  ; defines when investigating another page range.
  -DCACHE_GENERATION_DIAGNOSTICS=1
  -DCACHE_DIAGNOSTICS_PAGE_START=60
  -DCACHE_DIAGNOSTICS_PAGE_END=72
  -DISSUE18_DIAGNOSTICS=1
custom_i18n_languages = ENGLISH, JAPANESE

[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
custom_i18n_languages = ENGLISH, JAPANESE
