  - name: SourceCodePro
    description: "Adobe monospace with excellent hinting (Latin)"
    intervals: latin-ext
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/adobe-fonts/source-code-pro/release/TTF/SourceCodePro-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/adobe-fonts/source-code-pro/release/TTF/SourceCodePro-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/adobe-fonts/source-code-pro/release/TTF/SourceCodePro-It.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/adobe-fonts/source-code-pro/release/TTF/SourceCodePro-BoldIt.ttf"}

  # ── Accessibility ──────────────────────────────────────────────────────

  - name: AtkinsonHyperlegible
    description: "Accessibility font for low vision (Latin)"
    intervals: latin-ext
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/main/fonts/ttf/AtkinsonHyperlegibleNext-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/main/fonts/ttf/AtkinsonHyperlegibleNext-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/main/fonts/ttf/AtkinsonHyperlegibleNext-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/main/fonts/ttf/AtkinsonHyperlegibleNext-BoldItalic.ttf"}

  # Canonical SD package for the former built-in accessibility font.
  - name: OpenDyslexic
    description: "Accessibility font designed for dyslexia (Latin, Greek, Cyrillic)"
    intervals: builtin,latin-ext,greek,cyrillic,symbols
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular:    {path: "builtinFonts/source/OpenDyslexic/OpenDyslexic-Regular.otf"}
      bold:       {path: "builtinFonts/source/OpenDyslexic/OpenDyslexic-Bold.otf"}
      italic:     {path: "builtinFonts/source/OpenDyslexic/OpenDyslexic-Italic.otf"}
      bolditalic: {path: "builtinFonts/source/OpenDyslexic/OpenDyslexic-BoldItalic.otf"}

  # ── Japanese ─────────────────────────────────────────────────────────

  - name: NotoSansJp
    description: "Sans-serif Japanese with reading symbols"
    # Match the manually verified SD package: full BMP CJK coverage plus
    # common reading symbols and the supplementary-plane character 𠮟.
    intervals: ascii,latin1,greek,cyrillic,punctuation,arrows,math,currency,enclosed,symbols,boxdrawing,jp_number_symbols,jp-extra-noto,cjk,jp-supplementary-common
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular: {url: "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf"}
      bold:    {url: "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf"}

  - name: BIZUDGothic
    description: "UD Gothic Japanese (MORISAWA, with reading symbols)"
    intervals: ascii,latin1,greek,cyrillic,punctuation,arrows,math,currency,enclosed,symbols,boxdrawing,jp_number_symbols,jp-extra-biz,cjk,jp-supplementary-common
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular: {url: "https://github.com/googlefonts/morisawa-biz-ud-gothic/raw/main/fonts/ttf/BIZUDGothic-Regular.ttf"}
      bold:    {url: "https://github.com/googlefonts/morisawa-biz-ud-gothic/raw/main/fonts/ttf/BIZUDGothic-Bold.ttf"}

  - name: NotoSerifJp
    description: "Serif Japanese with reading symbols"
    intervals: ascii,latin1,greek,cyrillic,punctuation,arrows,math,currency,enclosed,symbols,boxdrawing,jp_number_symbols,jp-extra-noto,cjk,jp-supplementary-common
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      # Use the static faces directly: Medium for ordinary reading text and
      # Bold for EPUB emphasis.  This matches the established Yomuka package
      # and avoids depending on variable-font instance generation.
      regular: {url: "https://github.com/notofonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Medium.otf"}
      bold:    {url: "https://github.com/notofonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Bold.otf"}

  - name: BIZUDMincho
    description: "UD Mincho Japanese (MORISAWA, with reading symbols)"
    intervals: ascii,latin1,greek,cyrillic,punctuation,arrows,math,currency,enclosed,symbols,boxdrawing,jp_number_symbols,jp-extra-biz,cjk,jp-supplementary-common
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular: {url: "https://github.com/googlefonts/morisawa-biz-ud-mincho/raw/main/fonts/ttf/BIZUDMincho-Regular.ttf"}
      bold:    {url: "https://github.com/googlefonts/morisawa-biz-ud-mincho/raw/main/fonts/ttf/BIZUDMincho-Bold.ttf"}

  - name: ZenMaruGothic
    description: "Rounded Japanese Gothic (optional; curated CJK coverage)"
    intervals: builtin,latin-ext,greek,cyrillic,symbols,boxdrawing,enclosed,jp_number_symbols,jp-extra-zen,cjk,jp-supplementary-common
    # Use only glyphs actually present in the configured Regular and Bold
    # sources. This avoids large runs of empty CJK placeholders.
    codepoints_from_styles: true
    # Empty EPUB paragraphs use U+200B (and C0 controls) during layout.
    # Keep them non-visible rather than rendering a replacement glyph.
    include_controls: true
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular: {url: "https://raw.githubusercontent.com/googlefonts/zen-marugothic/main/fonts/ttf/ZenMaruGothic-Regular.ttf"}
      bold:    {url: "https://raw.githubusercontent.com/googlefonts/zen-marugothic/main/fonts/ttf/ZenMaruGothic-Bold.ttf"}

  # ── Additional scripts (no complex shaping needed) ─────────────────────

  - name: NotoSansArmenian
    description: "Armenian script"
    intervals: armenian
    sizes: [12, 14, 16, 18]
    styles:
      regular: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarmenian/NotoSansArmenian%5Bwdth%2Cwght%5D.ttf", variable: {wght: 400, wdth: 100}}

  - name: NotoSansGeorgian
    description: "Georgian script"
    intervals: georgian
    sizes: [12, 14, 16, 18]
    styles:
      regular: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansgeorgian/NotoSansGeorgian%5Bwdth%2Cwght%5D.ttf", variable: {wght: 400, wdth: 100}}

  - name: NotoSansEthiopic
    description: "Ethiopic/Ge'ez script"
    intervals: ethiopic
    sizes: [12, 14, 16, 18]
    styles:
      regular: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansethiopic/NotoSansEthiopic%5Bwdth%2Cwght%5D.ttf", variable: {wght: 400, wdth: 100}}

  - name: NotoSansCherokee
    description: "Cherokee syllabary"
    intervals: cherokee
    sizes: [12, 14, 16, 18]
    styles:
      regular: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanscherokee/NotoSansCherokee%5Bwght%5D.ttf", variable: {wght: 400}}

  - name: NotoSansTifinagh
    description: "Tifinagh script"
    intervals: tifinagh
    sizes: [12, 14, 16, 18]
    styles:
      regular: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstifinagh/NotoSansTifinagh-Regular.ttf"}
